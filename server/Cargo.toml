[package]
name = "graphviz-preview"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Language server that renders Graphviz DOT files to PNG previews for the Zed editor"
repository = "https://github.com/gabeins/zed-graphviz"
publish = false

# Standalone package: not part of the extension crate at the repository root.
[workspace]

[features]
default = ["bundled"]
# Embed a WebAssembly build of Graphviz so the server works without `dot`.
bundled = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
base64 = "0.23"
crossbeam-channel = "0.5"
dark-light = "3"
dirs = "7"
lsp-server = "0.10"
lsp-types = "0.97"
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"
wait-timeout = "0.2"
which = "8"
wasmtime = { version = "49", optional = true, default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "49", optional = true, default-features = false, features = ["p1"] }

[dev-dependencies]
png = "0.18"
roxmltree = "0.21"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
