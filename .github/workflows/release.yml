name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the extension and server versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          extension=$(sed -n 's/^version = "\(.*\)"/\1/p' extension.toml | head -n1)
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          server=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -n1)
          echo "tag=$version extension.toml=$extension Cargo.toml=$crate server/Cargo.toml=$server"
          test "$version" = "$extension" && test "$version" = "$crate" && test "$version" = "$server"

  graphviz-wasm:
    name: Build graphviz.wasm
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the downloads are cached; build.sh verifies them against the
      # checksums it pins and always builds from pristine sources.
      - name: Cache source and toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/graphviz-wasm/.work/downloads
          key: graphviz-wasm-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/graphviz-wasm/build.sh') }}

      - name: Build
        run: ./server/graphviz-wasm/build.sh
        env:
          JOBS: 4

      - name: Record checksum
        run: |
          {
            echo '### graphviz.wasm'
            echo
            echo '```'
            cat server/graphviz-wasm/graphviz.wasm.sha256
            echo '```'
            echo "Size: $(wc -c < server/graphviz-wasm/graphviz.wasm) bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphviz-wasm
          path: |
            server/graphviz-wasm/graphviz.wasm
            server/graphviz-wasm/graphviz.wasm.sha256
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: graphviz-wasm
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          # The oldest supported Ubuntu keeps the glibc requirement low.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graphviz-wasm
          path: server/graphviz-wasm
      - name: Verify graphviz.wasm
        working-directory: server/graphviz-wasm
        run: |
          expected=$(cut -d' ' -f1 graphviz.wasm.sha256)
          if command -v sha256sum >/dev/null; then
            actual=$(sha256sum graphviz.wasm | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 graphviz.wasm | cut -d' ' -f1)
          fi
          echo "graphviz.wasm sha256 $actual"
          test "$expected" = "$actual"
      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: Build
        working-directory: server
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist package
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then
            binary=graphviz-preview.exe
          else
            binary=graphviz-preview
          fi
          cp "server/target/$TARGET/release/$binary" package/
          cp license package/LICENSE
          # Licences of the embedded Graphviz build.
          cp server/graphviz-wasm/THIRD_PARTY_NOTICES.md package/
          cp -R server/graphviz-wasm/licenses package/licenses
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then
            archive="graphviz-preview-$TARGET.zip"
            (cd package && 7z a -tzip "../dist/$archive" ./*)
          else
            archive="graphviz-preview-$TARGET.tar.gz"
            tar -czf "dist/$archive" -C package .
          fi
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphviz-preview-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: graphviz-preview-*
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Graphviz extension $TAG"
          fi
          gh release upload "$TAG" dist/* --clobber
